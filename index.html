<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phyo Zaw Oo | Personal Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --glass: rgba(255,255,255,.16);
    --border: rgba(255,255,255,.28);
}

body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    color: white;
    overflow-x: hidden;
    background: #101e36;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    z-index: -5;
    background:
    linear-gradient(rgba(5,15,30,.25),rgba(5,15,30,.45)),
    url("YOUR_WALLPAPER_URL") center/cover no-repeat;
    animation: zoom 25s ease-in-out infinite alternate;
}

@keyframes zoom {
    from { transform: scale(1); }
    to { transform: scale(1.10); }
}

/* LIGHT EFFECT */

.light {
    position: fixed;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .3;
    z-index: -3;
    pointer-events: none;
    animation: floating 8s ease-in-out infinite alternate;
}

.light.one {
    background: #00cfff;
    top: 5%;
    left: 5%;
}

.light.two {
    background: #a855f7;
    bottom: 5%;
    right: 5%;
    animation-delay: 2s;
}

@keyframes floating {
    to { transform: translate(70px,60px); }
}

/* MAIN DASHBOARD */

.dashboard {
    width: min(1250px,94%);
    min-height: 570px;
    margin: 7vh auto 110px;
    padding: 30px;

    display: grid;
    grid-template-columns: 75px 1fr 300px;
    gap: 25px;

    background: var(--glass);
    backdrop-filter: blur(23px);
    -webkit-backdrop-filter: blur(23px);

    border: 1px solid var(--border);
    border-radius: 35px;

    box-shadow: 0 20px 60px rgba(0,0,0,.25);

    animation: appear 1.2s ease both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* SIDEBAR */

.sidebar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 15px 0;
}

.social {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;

    border-radius: 50%;
    background: rgba(0,0,0,.7);

    color: white;
    font-size: 21px;
    font-weight: 600;
    text-decoration: none;

    transition: .35s;
}

.social:hover {
    transform: scale(1.15) rotate(8deg);
    background: white;
    color: black;
    box-shadow: 0 0 20px white;
}

/* CENTER */

.center {
    display: flex;
    flex-direction: column;
    gap: 35px;
}

.clock-area {
    padding: 5px 10px;
}

.clock {
    font-size: clamp(38px,5vw,55px);
    font-weight: 600;
    letter-spacing: 2px;
    text-shadow: 0 3px 15px rgba(0,0,0,.2);
}

.date {
    font-size: 14px;
    opacity: .85;
}

/* CALENDAR */

.calendar {
    width: 235px;
    padding: 20px;
    background: rgba(10,10,10,.78);
    border-radius: 23px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,.2);
    transition: .35s;
}

.calendar:hover {
    transform: translateY(-5px);
}

.month {
    font-size: 23px;
    font-weight: 600;
    padding-bottom: 15px;
}

.weekdays,
.days {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    gap: 7px;
}

.weekdays span {
    font-size: 10px;
    opacity: .65;
}

.days span {
    font-size: 12px;
    padding: 5px 0;
    border-radius: 50%;
}

.days .today {
    background: white;
    color: black;
    font-weight: 700;
}

/* RIGHT PANEL */

.right-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.profile {
    text-align: right;
    padding: 8px 5px;
}

.profile h2 {
    font-size: 23px;
}

.profile p {
    font-size: 12px;
    opacity: .75;
}

/* PHOTO GALLERY */

.gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 130px 130px;
    gap: 12px;
}

.photo {
    overflow: hidden;
    border-radius: 17px;
    background: rgba(255,255,255,.2);
    border: 1px solid rgba(255,255,255,.3);
}

.photo:first-child {
    grid-row: span 2;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: .5s;
}

.photo:hover img {
    transform: scale(1.1);
}

/* MUSIC PLAYER */

.music {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px;
    padding: 12px;
}

.music-icon {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    background: #111;
    display: grid;
    place-items: center;
    font-size: 20px;
}

.music-info {
    flex: 1;
}

.music-info h4 {
    font-size: 12px;
}

.music-info p {
    font-size: 10px;
    opacity: .7;
}

/* BOTTOM DOCK */

.dock {
    position: fixed;
    z-index: 20;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    padding: 13px 22px;
    border-radius: 30px;

    background: rgba(255,255,255,.19);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

.app {
    width: 49px;
    height: 49px;
    display: grid;
    place-items: center;

    border-radius: 13px;
    text-decoration: none;
    font-size: 19px;
    font-weight: 700;

    transition: .35s;
    position: relative;
    flex-shrink: 0;
}

.app:hover {
    transform: translateY(-13px) scale(1.15);
}

.app::after {
    content: attr(data-name);
    position: absolute;
    bottom: 62px;

    background: rgba(0,0,0,.85);
    color: white;
    padding: 5px 10px;
    border-radius: 8px;

    font-size: 10px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: .3s;
}

.app:hover::after {
    opacity: 1;
}

/* APP COLORS */

.windows {
    color: #55aaff;
    font-size: 30px;
}

.spotify {
    background: #1db954;
    color: black;
    border-radius: 50%;
}

.photoshop {
    background: #001e36;
    color: #31a8ff;
}

.illustrator {
    background: #330000;
    color: #ff9a00;
}

.chrome {
    background: white;
    color: #4285f4;
    border-radius: 50%;
}

.aftereffects {
    background: #170b3d;
    color: #9990ff;
}

.discord {
    background: #5865f2;
    color: white;
    border-radius: 50%;
}

.pixellab {
    background: white;
    overflow: hidden;
}

.canva {
    background: white;
    overflow: hidden;
}

/* IMAGE APP ICONS */

.canva img,
.pixellab img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* FLOATING PARTICLES */

.particle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    opacity: .5;
    animation: particle 8s linear infinite;
    z-index: -1;
    pointer-events: none;
}

@keyframes particle {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    20% { opacity: .6; }
    to {
        transform: translateY(-100px);
        opacity: 0;
    }
}

/* RESPONSIVE */

@media(max-width:850px) {
    .dashboard {
        grid-template-columns: 55px 1fr;
        padding: 20px;
    }

    .right-panel {
        grid-column: 2;
    }
}

@media(max-width:520px) {
    .dashboard {
        width: 94%;
        margin-top: 25px;
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 18px;
    }

    .sidebar {
        grid-row: 2;
        flex-direction: row;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
    }

    .center {
        grid-row: 1;
        align-items: center;
    }

    .right-panel {
        grid-column: 1;
    }

    .profile {
        text-align: center;
    }

    .calendar {
        width: 100%;
        max-width: 300px;
    }

    .gallery {
        grid-template-rows: 140px 140px;
    }

    .dock {
        width: 96%;
        max-width: 96%;
        justify-content: flex-start;
        overflow-x: auto;
        gap: 8px;
        padding: 10px;
    }

    .app {
        width: 38px;
        height: 40px;
        font-size: 15px;
    }

    .dock::-webkit-scrollbar {
        display: none;
    }
}
</style>
</head>

<script>

/* DIGITAL CLOCK */

function updateClock() {

    const now = new Date();

    const hours =
        String(now.getHours()).padStart(2,'0');

    const minutes =
        String(now.getMinutes()).padStart(2,'0');

    document.getElementById('clock').textContent =
        hours + ':' + minutes;

    document.getElementById('date').textContent =
        now.toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

}

updateClock();
setInterval(updateClock,1000);


/* AUTOMATIC CALENDAR */

function createCalendar() {

    const now = new Date();

    const year = now.getFullYear();
    const month = now.getMonth();
    const today = now.getDate();

    const firstDay =
        new Date(year,month,1).getDay();

    const lastDate =
        new Date(year,month+1,0).getDate();

    document.getElementById('month').textContent =
        new Date(year,month).toLocaleDateString(
            'en-US',
            {month:'long'}
        );

    const days = document.getElementById('days');

    days.innerHTML = '';

    for(let i=0;i<firstDay;i++) {

        days.appendChild(
            document.createElement('span')
        );

    }

    for(let i=1;i<=lastDate;i++) {

        const day = document.createElement('span');

        day.textContent = i;

        if(i===today) {
            day.classList.add('today');
        }

        days.appendChild(day);

    }

}

createCalendar();


/* FLOATING PARTICLES */

for(let i=0;i<25;i++) {

    const particle = document.createElement('div');

    particle.className = 'particle';

    particle.style.left =
        Math.random()*100+'%';

    particle.style.animationDelay =
        Math.random()*8+'s';

    particle.style.animationDuration =
        (5+Math.random()*8)+'s';

    document.body.appendChild(particle);

}

</script>
